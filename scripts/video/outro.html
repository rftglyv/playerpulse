<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@500;600;700&display=block" rel="stylesheet">
<style>
  :root { --bg: #231f20; --ink: #ffffff; --yellow: #ffde59; --coral: #ff6d4d; --green: #53c283; --purple: #737ae6; --blue: #2563eb; --soft: #dbeafe; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
  .stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg);
    background-image: radial-gradient(rgba(255,255,255,.07) 1.6px, transparent 1.7px); background-size: 34px 34px; }
  .circle { position: absolute; right: -170px; bottom: -330px; width: 760px; height: 760px; border-radius: 50%; background: #3d3c60; transform: scale(0); }
  .pix { position: absolute; width: 30px; height: 30px; border-radius: 3px; transform: scale(0); }
  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .mark { width: 230px; height: 214px; margin-bottom: 64px; transform: scale(0); }
  .headline { display: flex; align-items: center; gap: 34px; font-family: "Anton", Impact, sans-serif; font-size: 168px; line-height: 1; color: var(--ink); text-transform: uppercase; letter-spacing: 1px; }
  .words { display: flex; gap: 34px; }
  .word { display: inline-block; clip-path: inset(0 0 0 0); }
  .word span { display: inline-block; transform: translateY(110%); }
  .hl { position: relative; padding: 14px 30px 10px; transform: rotate(-2.4deg); }
  .hl .bar { position: absolute; inset: 0; background: var(--yellow); transform: scaleX(0); transform-origin: left center; }
  .hl .txt { position: relative; color: #1b1718; opacity: 0; }
  .tag { margin-top: 62px; font-family: "Manrope", system-ui, sans-serif; font-weight: 600; font-size: 50px; color: #e9eafb; opacity: 0; transform: translateY(18px); }
  .doodle { position: absolute; overflow: visible; }
  .doodle path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="circle" id="circle"></div>
  <div class="pix" id="p1" style="right:118px;top:96px;background:var(--yellow)"></div>
  <div class="pix" id="p2" style="right:178px;top:132px;background:var(--coral)"></div>
  <div class="pix" id="p3" style="right:118px;top:172px;background:var(--green)"></div>

  <!-- hand-drawn doodles, same family as the landing hero -->
  <svg class="doodle" id="d-pad" viewBox="0 0 84 52" style="left:190px;top:170px;width:190px;transform:rotate(-12deg)">
    <path stroke="var(--purple)" stroke-width="2.6" pathLength="1" d="M22 8 C 10 8, 4 22, 4 34 C 4 46, 14 50, 20 42 C 24 36, 28 34, 42 34 C 56 34, 60 36, 64 42 C 70 50, 80 46, 80 34 C 80 22, 74 8, 62 8 C 52 8, 50 12, 42 12 C 34 12, 32 8, 22 8"/>
    <path stroke="var(--purple)" stroke-width="2.6" pathLength="1" d="M20 18 L 20 30 M14 24 L 26 24"/>
    <path stroke="var(--purple)" stroke-width="2.6" pathLength="1" d="M60 19 C 62 19, 62 22, 60 22 C 58 22, 58 19, 60 19 M66 25 C 68 25, 68 28, 66 28 C 64 28, 64 25, 66 25"/>
  </svg>
  <svg class="doodle" id="d-star" viewBox="0 0 40 40" style="left:1330px;top:150px;width:96px;transform:rotate(12deg)">
    <path stroke="var(--yellow)" stroke-width="2.4" pathLength="1" d="M20 4 L 24 15 L 36 16 L 27 24 L 30 36 L 20 29 L 10 36 L 13 24 L 4 16 L 16 15 Z"/>
  </svg>
  <svg class="doodle" id="d-splash" viewBox="0 0 40 40" style="left:420px;top:780px;width:110px">
    <path stroke="var(--coral)" stroke-width="2.4" pathLength="1" d="M20 4 L 20 12 M20 28 L 20 36 M4 20 L 12 20 M28 20 L 36 20 M8 8 L 13 13 M27 27 L 32 32 M32 8 L 27 13 M8 32 L 13 27"/>
  </svg>
  <svg class="doodle" id="d-bubble" viewBox="0 0 52 44" style="left:1610px;top:150px;width:150px;transform:rotate(8deg)">
    <path stroke="var(--green)" stroke-width="2.4" pathLength="1" d="M8 6 C 22 3, 38 3, 46 7 C 50 12, 50 24, 46 28 C 38 31, 26 31, 18 30 L 9 38 L 11 29 C 5 27, 3 20, 4 13 C 4 9, 5 7, 8 6"/>
    <path stroke="var(--green)" stroke-width="2.8" pathLength="1" d="M27 11 L 27 19 M27 23 L 27 24"/>
  </svg>
  <svg class="doodle" id="d-heart" viewBox="0 0 36 32" style="left:150px;top:860px;width:84px;transform:rotate(-8deg)">
    <path stroke="var(--coral)" stroke-width="2.2" pathLength="1" d="M6 4 L 12 4 L 12 8 L 16 8 L 16 4 L 22 4 M22 4 L 28 4 L 28 8 L 32 8 L 32 16 L 28 16 L 28 20 L 24 20 L 24 24 L 20 24 L 20 28 L 16 28 L 16 24 L 12 24 L 12 20 L 8 20 L 8 16 L 4 16 L 4 8 L 6 8 L 6 4"/>
  </svg>
  <svg class="doodle" id="d-coin" viewBox="0 0 36 36" style="left:1440px;top:820px;width:80px">
    <path stroke="var(--yellow)" stroke-width="2.4" pathLength="1" d="M18 4 C 27 4, 32 10, 32 18 C 32 27, 26 32, 18 32 C 9 32, 4 26, 4 18 C 4 10, 10 4, 19 4"/>
    <path stroke="var(--yellow)" stroke-width="2.4" pathLength="1" d="M18 11 L 18 25"/>
  </svg>

  <div class="center">
    <svg class="mark" id="mark" viewBox="4 3 56 52">__MARK__</svg>
    <div class="headline">
      <div class="words"><span class="word"><span>Sign</span></span><span class="word"><span>in</span></span><span class="word"><span>to</span></span></div>
      <div class="hl" id="hl"><div class="bar"></div><div class="txt">PlayerPulse</div></div>
    </div>
    <div class="tag" id="tag">Player complaints in. Real bugs out.</div>
  </div>
</div>
<script src="__ANIME__"></script>
<script>
  const { animate, stagger, createTimeline } = anime;
  // initial doodle state: undrawn
  document.querySelectorAll('.doodle path').forEach((p) => { p.style.strokeDasharray = '1'; p.style.strokeDashoffset = '1'; });
  // heart pixels start hidden, revealed in a dithered order
  const cells = [...document.querySelectorAll('#mark rect')];
  cells.forEach((r) => { r.style.transformBox = 'fill-box'; r.style.transformOrigin = 'center'; r.style.transform = 'scale(0)'; });
  const order = cells.map((r, i) => ({ r, k: (i * 37) % cells.length })).sort((a, b) => a.k - b.k).map((o) => o.r);
  const bubble = document.querySelector('#mark path');

  window.__play = () => {
    const tl = createTimeline({ autoplay: false, defaults: { ease: 'outExpo' } });
    tl.add('#circle', { scale: [0, 1], duration: 1400, ease: 'outQuart' }, 0)
      .add('#mark', { scale: [0, 1.12, 1], duration: 900, ease: 'outBack(1.8)' }, 150)
      .add(order, { scale: [0, 1], duration: 380, delay: stagger(16), ease: 'outBack(2)' }, 520)
      .add('#mark', { scale: [1, 1.08, 1, 1.05, 1], duration: 900, ease: 'inOutSine' }, 1500)
      .add('.word > span', { translateY: ['110%', '0%'], duration: 900, delay: stagger(110) }, 900)
      .add('#hl .bar', { scaleX: [0, 1], duration: 650, ease: 'inOutQuart' }, 1250)
      .add('#hl .txt', { opacity: [0, 1], translateX: [-20, 0], duration: 500 }, 1650)
      .add('#hl', { rotate: ['-6deg', '-2.4deg'], scale: [1.06, 1], duration: 900, ease: 'outElastic(1, .6)' }, 1250)
      .add('#tag', { opacity: [0, 1], translateY: [18, 0], duration: 800 }, 2050)
      .add(['#p1', '#p2', '#p3'], { scale: [0, 1.25, 1], duration: 600, delay: stagger(120), ease: 'outBack(2)' }, 1100);
    const doodles = ['#d-pad', '#d-star', '#d-heart', '#d-bubble', '#d-coin', '#d-splash'];
    doodles.forEach((sel, i) => {
      tl.add(`${sel} path`, { strokeDashoffset: [1, 0], duration: 900, delay: stagger(160), ease: 'inOutQuad' }, 1900 + i * 260);
    });
    // gentle float on the doodles and corner pixels for the hold
    tl.add(doodles, { translateY: [0, -10, 0], duration: 2600, delay: stagger(180), ease: 'inOutSine' }, 3400);
    tl.add(['#p1', '#p2', '#p3'], { rotate: [0, 90], duration: 900, delay: stagger(140), ease: 'inOutBack' }, 4200);
    window.__seek = (ms) => tl.seek(ms);
  };
</script>
</body>
</html>
